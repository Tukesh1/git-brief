name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write 

    steps:
      - uses: actions/checkout@v4

      - name: Nimo AI Code Review
        uses: Tukesh1/nimo-code-review-agent@main
        with:
          # Automatically uses the secure, temporary token generated by GitHub
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Set the provider to OpenRouter
          ai_provider: 'openrouter'
          
          # Choose any model from OpenRouter (e.g., meta-llama/llama-3-70b-instruct)
          ai_model: ${{ vars.AI_MODEL }}
          
          # Pulls your secure OpenRouter API key from your GitHub Repository Secrets
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
